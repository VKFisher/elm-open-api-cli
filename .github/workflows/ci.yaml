name: Merge Checks
run-name: ${{ github.actor }} is testing out GitHub Actions 🚀
on:
  pull_request:
    branches:
      - main
jobs:
  lint-and-test:
    permissions:
      checks: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Reads the pinned pnpm version from package.json's "packageManager".
      - uses: pnpm/action-setup@v4
      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      # Re-use ~/.elm between runs until elm.json or review/elm.json changes.
      # The Elm compiler saves downloaded packages and tool executables there.
      - name: Cache ~/.elm
        uses: actions/cache@v4
        with:
          path: ~/.elm
          key: elm-${{ hashFiles('elm.json', 'review/elm.json') }}

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm run format
      - name: Review
        run: pnpm run review
      - name: Test
        run: pnpm run test

  diff-generation:
    permissions:
      checks: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          path: branch

      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          path: main

      # Reads the pinned pnpm version from the branch's package.json.
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: branch/package.json
      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Re-use ~/.elm between runs until elm.json or review/elm.json changes.
      - name: Cache ~/.elm (both)
        uses: actions/cache@v4
        with:
          path: ~/.elm
          key: elm-${{ hashFiles('main/elm.json', 'main/review/elm.json', 'branch/elm.json', 'branch/review/elm.json') }}

      - name: Install (branch)
        working-directory: branch
        run: pnpm install --frozen-lockfile

      # `|| true`: until this migration lands on main, the base branch still
      # uses bun and has no pnpm-lock.yaml, so a frozen install fails there.
      # Self-heals once merged. The Generate step below already tolerates a
      # missing main install via its own `|| true`.
      - name: Install (main)
        working-directory: main
        run: pnpm install --frozen-lockfile || true

      - name: Generate (branch)
        working-directory: branch
        run: pnpm run test:gen

      - name: Generate (main)
        working-directory: main
        run: pnpm run test:gen || true # We don't want to block on main failing to generate

      - name: Diff the outputs
        run: |
          echo '```diff' > diff.md
          diff --ignore-all-space --minimal --new-file --recursive \
            main/cli/generated \
            branch/cli/generated | dd bs=1024 count=30 >> diff.md || true # We ignore diff exiting with a 1
          echo -e '\n```' >> diff.md

      - name: Post a comment with the diff
        uses: JoseThen/comment-pr@v1.2.0
        continue-on-error: true
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          file_path: "./diff.md"

      - name: Dump the diff into the Github log
        run: |
          diff --ignore-all-space --minimal --new-file --recursive \
            main/cli/generated branch/cli/generated
